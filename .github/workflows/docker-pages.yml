
name: Docker Build and GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/docker-devops

jobs:

  # JOB 1 : Construction et publication de l'image Docker
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # JOB 2 : Extraction du fichier HTML depuis le conteneur
  extract-html:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}:latest

      - name: Create temporary container
        run: docker create --name temp-container ${{ env.DOCKER_IMAGE }}:latest

      - name: Extract HTML file
        run: |
          mkdir -p public
          docker cp temp-container:/usr/share/nginx/html/index.html public/index.html

      - name: Remove temporary container
        if: always()
        run: docker rm -f temp-container || true

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: public/

  # JOB 3 : Déploiement sur GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    needs: extract-html

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: website
          path: public/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
